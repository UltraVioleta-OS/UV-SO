name: Publicar en testing
on:
  push:
    branches: [main]
    paths:
      - 'UVcommon/UVcommon-Update/**'
  workflow_dispatch:

concurrency: apt-repo

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GPG_KEYID: ${{ secrets.GPG_KEYID }}
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
      C: UVcommon/UVcommon-Update
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y reprepro gnupg

      - name: Importar clave de firma
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          [ -n "$GPG_PRIVATE_KEY" ] || { echo "ERROR: GPG_PRIVATE_KEY llega vacio"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import 2>&1
          gpg --list-secret-keys --keyid-format long

      - name: Construir .deb
        run: bash $C/scripts/build-debs.sh

      - name: Descargar rama gh-pages
        run: bash $C/scripts/pages-fetch.sh "$RUNNER_TEMP/pages"

      - name: Fijar clave de firma en la configuracion
        run: |
          [ -n "$GPG_KEYID" ] || { echo "ERROR: GPG_KEYID llega vacio"; exit 1; }
          echo "Longitud de GPG_KEYID: ${#GPG_KEYID}"
          sed -i "s/^SignWith:.*/SignWith: $GPG_KEYID/" $C/repo/conf/distributions

      - name: Publicar en testing
        run: bash $C/scripts/publish-testing.sh "$RUNNER_TEMP/pages"

      - name: Copiar clave publica para instalacion manual
        run: cp $C/common/uvos-archive-keyring/usr/share/keyrings/uvos-archive-keyring.gpg "$RUNNER_TEMP/pages/"

      - name: Subir a gh-pages
        run: bash $C/scripts/pages-push.sh "$RUNNER_TEMP/pages" "testing ${{ github.sha }}"